/* Self-contained 404 page for SLV BAKERS — layout from bedimcode/responsive-404-page (MIT) */
:root{--first-color:#c69c6d;--text-color:#f6f2ed;--bg:#000;
  --body-font:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --title-font:'Roboto Slab',Georgia,'Times New Roman',serif;
  --biggest:2.6rem;--normal:.95rem;--small:.8rem}
@media(min-width:1024px){:root{--biggest:5rem;--normal:1.05rem}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;-webkit-text-size-adjust:100%}
body{background:#000;color:var(--text-color);font-family:var(--body-font);font-size:var(--normal);font-weight:500;min-height:100vh;overflow-x:hidden}
ul{list-style:none}a{text-decoration:none;color:inherit}button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
img{max-width:100%;height:auto}
.container{max-width:1024px;margin-inline:1.5rem}
@media(min-width:1048px){.container{margin-inline:auto}}

/* Header: logo left, links right (like the original template) */
.header{position:fixed;inset:0 0 auto 0;z-index:100}
.nav{height:4.5rem;display:flex;justify-content:space-between;align-items:center}
.nav__logo img{display:block;height:54px;width:auto;filter:brightness(0) invert(1)}
.nav__link{font-family:var(--title-font);font-weight:700;text-transform:uppercase;font-size:.9rem;letter-spacing:.03em;transition:color .3s}
.nav__link:hover{color:var(--first-color)}
.nav__toggle,.nav__close{display:inline-flex;padding:.5rem}
.nav__close{position:absolute;top:1rem;right:1.5rem}
@media(max-width:767px){
  .nav__menu{position:fixed;top:-110%;left:0;width:100%;background:#141414;border-bottom:2px solid var(--first-color);padding:5rem 0 3rem;border-radius:0 0 1.5rem 1.5rem;transition:top .4s}
  .nav__menu.show-menu{top:0}
  .nav__list{display:flex;flex-direction:column;align-items:center;row-gap:1.8rem}
}
@media(min-width:768px){
  .nav{height:6rem}
  .nav__toggle,.nav__close{display:none}
  .nav__list{display:flex;column-gap:3rem}
}

/* Hero */
.home{min-height:100vh;display:grid;padding:8rem 0 2rem;background:#000}
.home__container{display:grid;align-content:center;row-gap:2.5rem}
.home__data{text-align:center}
.home__subtitle{font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--first-color)}
.home__title{font-family:var(--title-font);font-size:var(--biggest);line-height:1.1;margin:.75rem 0}
.home__button{display:inline-block;margin-top:2rem;background:var(--first-color);color:#000;padding:.85rem 1.8rem;border-radius:3rem;font-weight:700;transition:box-shadow .3s,transform .3s}
.home__button:hover{box-shadow:0 4px 20px rgba(198,156,109,.5);transform:translateY(-2px)}
.home__img{justify-self:center}
.home__img img{width:230px;display:block;animation:floaty 1.8s infinite alternate ease-in-out}
.home__shadow{width:130px;height:24px;margin:0 auto;border-radius:50%;background:rgba(198,156,109,.35);filter:blur(9px);animation:shadow 1.8s infinite alternate ease-in-out}
.home__footer{display:flex;justify-content:center;column-gap:.5rem;font-size:var(--small);align-self:end}
.home__footer a:hover{color:var(--first-color)}

/* Entrance animations (same feel as the original ScrollReveal, pure CSS) */
.home__data{animation:fromTop 1.4s .3s both cubic-bezier(.5,0,0,1)}
.home__img{animation:fromBottom 1.4s .5s both cubic-bezier(.5,0,0,1)}
.home__footer{animation:fromBottom 1.4s .7s both cubic-bezier(.5,0,0,1)}
@keyframes fromTop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
@keyframes fromBottom{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes floaty{to{transform:translateY(15px)}}
@keyframes shadow{to{transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:320px){.home{padding-top:6rem}}
@media(min-width:1024px){
  .home__container{grid-template-columns:repeat(2,1fr);align-items:center;column-gap:2rem}
  .home__data{text-align:left}
  .home__img img{width:400px}
  .home__shadow{width:250px;height:40px}
}

<script>
(function(){
  var menu=document.getElementById('nav-menu'),t=document.getElementById('nav-toggle'),c=document.getElementById('nav-close');
  function set(o){menu.classList.toggle('show-menu',o);t.setAttribute('aria-expanded',String(o));}
  t.addEventListener('click',function(){set(true)});c.addEventListener('click',function(){set(false)});
  document.querySelectorAll('.nav__link').forEach(function(l){l.addEventListener('click',function(){set(false)})});
  // Work out where the site lives: domain root, GitHub Pages project (/repo/), or opened from disk
  var base='/';
  if(location.protocol==='file:'){
    base=null;
  }else if(/\.github\.io$/.test(location.hostname)){
    var user=location.hostname.split('.')[0].toLowerCase();
    var first=location.pathname.split('/')[1]||'';
    if(first && first.toLowerCase()!==user && first!=='404.html') base='/'+first+'/';
  }
  document.querySelectorAll('[data-home],[data-hash]').forEach(function(a){
    var hash=a.getAttribute('data-hash')||'';
    a.setAttribute('href', base===null ? 'index.html'+hash : base+hash);
  });
  // Optional brand fonts (page looks fine without them)
  if(base!==null){['robotoslab','roboto'].forEach(function(f){
    var l=document.createElement('link');l.rel='stylesheet';l.href=base+'css/'+f+'.css';document.head.appendChild(l);});}
})();
</script>
